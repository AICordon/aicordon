[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicordon-haystack"
version = "0.1.0"
description = "Check what an LLM is given for prompt injection: material at ingest, and the turn it answers"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
# The text travels WITH the wheel. `license = "Apache-2.0"` is only a label in the metadata, and a
# wheel that names a licence it does not carry makes the reader go and look for it.
license-files = ["LICENSE"]
authors = [{ name = "Mikhail Gribov", email = "mihail.gribov.rs@gmail.com" }]
keywords = ["haystack", "prompt-injection", "jailbreak", "rag", "llm-security", "guardrails"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# `aicordon>=1.1.0`, not `>=1.0.0`: the policy this wrapper imports (`aicordon.guard`) was folded
# into the detector in 1.1.0. Against 1.0.0 the install resolves and the import fails — the failure
# lands on the user, at the first line of their pipeline.
dependencies = ["haystack-ai>=3.0.0", "aicordon>=1.1.0"]

[project.urls]
Homepage = "https://github.com/AICordon/aicordon/blob/main/integrations/haystack/README.md"
Repository = "https://github.com/AICordon/aicordon"
Issues = "https://github.com/AICordon/aicordon/issues"
Changelog = "https://github.com/AICordon/aicordon/blob/main/integrations/haystack/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
# The namespace package of the host: an integration installs into `haystack_integrations` so that
# the import reads the same as a first-party one. No `__init__.py` above the leaf, by design.
packages = ["src/haystack_integrations"]
