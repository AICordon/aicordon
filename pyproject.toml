[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicordon"
version = "1.1.1"
description = "Local prompt-injection scanner for untrusted text: 100-200 documents/s on one CPU core, one false alarm per thousand, no model"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Gribov", email = "mihail.gribov.rs@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "prompt-injection", "indirect-prompt-injection", "jailbreak-detection", "ipi", "dpi",
    "llm-security",
    "ai-security", "guardrails", "detector",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Picket has no dependencies and must never grow any: the rule runs on the standard library. That is
# not asceticism but a property of the product — a detector with no model, no network, and no wheels
# to install.
dependencies = []

[project.urls]
Homepage = "https://ai-cordon.com"
Source = "https://github.com/AICordon/aicordon"

[project.scripts]
aicordon = "aicordon.cli.umbrella:main"

[tool.hatch.build.targets.wheel]
# One distribution, one top-level name. The products are subpackages (`aicordon.picket`) rather than
# flat imports: the flat name is taken on PyPI by an unrelated project — a rules tool for AI coding
# agents, near enough to end up installed alongside ours, at which point one import name would mean
# two different libraries.
packages = ["src/aicordon"]

# `aicordon.intent` is NOT shipped while the API behind it does not exist. The code stays in the
# repository — the contract is what keeps the two products identical — but a stub in a release reads
# as "get a key and it works", and no key would make it work. The umbrella treats an absent product
# as a normal state, so nothing else has to change.
exclude = ["/src/aicordon/intent"]

[tool.hatch.build.targets.sdist]
# The same list as for the wheel: `exclude` under the `wheel` target does not apply to the source
# archive, and `intent` was travelling in it unnoticed — while the decision was not to ship it.
#
# `/integrations` goes for the same reason: the wrappers are SEPARATE distributions with their own
# version and `pyproject.toml` — 41 files against the product's 29, and a source tree holding a
# second buildable project is a trap (`pip install .` in the wrong directory installs the wrong
# thing).
exclude = ["/src/aicordon/intent", "/integrations"]
