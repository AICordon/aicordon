[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aicordon"
version = "1.3.0"
description = "Prompt-injection detectors for untrusted text: Picket, a fast local rule, and Intent, the accurate AI Cordon detector over an API"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Mikhail Gribov", email = "mihail.gribov.rs@gmail.com" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = [
    "prompt-injection", "indirect-prompt-injection", "jailbreak-detection", "ipi", "dpi",
    "llm-security",
    "ai-security", "guardrails", "detector",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
# Picket has no dependencies and must never grow any: the rule runs on the standard library. That is
# not asceticism but a property of the product — a detector with no model, no network, and no wheels
# to install.
dependencies = []

[project.urls]
Homepage = "https://ai-cordon.com"
Source = "https://github.com/AICordon/aicordon"

[project.scripts]
aicordon = "aicordon.cli.umbrella:main"

[tool.hatch.build.targets.wheel]
# One distribution, one top-level name. The products are subpackages (`aicordon.picket`) rather than
# flat imports: the flat name is taken on PyPI by an unrelated project — a rules tool for AI coding
# agents, near enough to end up installed alongside ours, at which point one import name would mean
# two different libraries.
packages = ["src/aicordon"]

# `aicordon.intent` ships from 1.3.0: the API behind it is live, and the client talks to it.

[tool.hatch.build.targets.sdist]
# `/integrations` stays out of the source archive: the wrappers are SEPARATE distributions with their own
# version and `pyproject.toml` — 41 files against the product's 29, and a source tree holding a
# second buildable project is a trap (`pip install .` in the wrong directory installs the wrong
# thing).
exclude = ["/integrations"]
